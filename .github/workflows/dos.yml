name: DJGPP DOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dos:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4

      - name: Initialize DOS player submodules
        run: |
          git submodule update --init --recursive \
            playopl/adplug-git playopl/libbinio-git \
            playqoa/qoa-git \
            playsid/libsidplayfp-git playsid/libresidfp-git \
            playsndh/psgplay-git \
            playtimidity/timidity-git

      - name: Install build and DOS test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison build-essential bsdextrautils cmake flex \
            gettext libfl-dev libfl2 libtool ninja-build perl pkg-config \
            python3 software-properties-common texinfo unzip wget xa65
          sudo add-apt-repository -y ppa:dosemu2/ppa
          sudo apt-get update
          sudo apt-get install -y dosemu2

      - name: Install DJGPP cross compiler
        run: |
          wget -q https://github.com/andrewwutw/build-djgpp/releases/download/v3.4/djgpp-linux64-gcc1220.tar.bz2
          sudo tar -xjf djgpp-linux64-gcc1220.tar.bz2 -C /usr/local
          echo "/usr/local/djgpp/bin" >> "$GITHUB_PATH"
          echo "DJDIR=/usr/local/djgpp/i586-pc-msdosdjgpp" >> "$GITHUB_ENV"

      - name: Build static DJGPP dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PREFIX="$RUNNER_TEMP/djgpp-deps"
          export SOURCES="$RUNNER_TEMP/djgpp-sources"
          export PATH="/usr/local/djgpp/bin:$PATH"
          export SDL_TOOLCHAIN="$SOURCES/SDL/build-scripts/i586-pc-msdosdjgpp.cmake"
          mkdir -p "$PREFIX" "$SOURCES"

          git clone --depth 1 https://github.com/libsdl-org/SDL.git "$SOURCES/SDL"
          printf 'include("%s")\nset(CMAKE_SYSTEM_PROCESSOR i586 CACHE STRING "" FORCE)\n' \
            "$SDL_TOOLCHAIN" > "$PREFIX/djgpp-toolchain.cmake"
          export TOOLCHAIN="$PREFIX/djgpp-toolchain.cmake"

          git clone --depth 1 https://github.com/madler/zlib.git "$SOURCES/zlib"
          git clone --depth 1 https://github.com/libarchive/bzip2.git "$SOURCES/bzip2"
          git clone --depth 1 https://github.com/libjpeg-turbo/libjpeg-turbo.git "$SOURCES/libjpeg"
          git clone --depth 1 https://github.com/pnggroup/libpng.git "$SOURCES/libpng"
          git clone --depth 1 https://github.com/freetype/freetype.git "$SOURCES/freetype"
          git clone --depth 1 https://github.com/xiph/ogg.git "$SOURCES/ogg"
          git clone --depth 1 https://github.com/xiph/vorbis.git "$SOURCES/vorbis"
          git -C "$SOURCES/SDL" apply "$GITHUB_WORKSPACE/.github/patches/sdl-dos-vesa.patch"
          git -C "$SOURCES/ogg" apply "$GITHUB_WORKSPACE/.github/patches/ogg-djgpp.patch"

          cmake_djgpp() {
            local source="$1"
            shift
            local name
            name="$(basename "$source")"
            cmake -S "$source" -B "$PREFIX/build/$name" \
              -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$PREFIX" \
              -DCMAKE_PREFIX_PATH="$PREFIX" "$@"
            cmake --build "$PREFIX/build/$name" --parallel 2
            cmake --install "$PREFIX/build/$name"
          }

          cmake_djgpp "$SOURCES/zlib" \
            -DZLIB_BUILD_SHARED=OFF -DZLIB_BUILD_STATIC=ON \
            -DZLIB_BUILD_TESTING=OFF
          cmake_djgpp "$SOURCES/bzip2" \
            -DENABLE_STATIC_LIB=ON -DENABLE_SHARED_LIB=OFF \
            -DENABLE_APP=OFF -DENABLE_DOCS=OFF -DENABLE_EXAMPLES=OFF
          cp "$PREFIX/lib/libbz2_static.a" "$PREFIX/lib/libbz2.a"
          cmake_djgpp "$SOURCES/libjpeg" \
            -DENABLE_SHARED=OFF -DENABLE_STATIC=ON \
            -DWITH_SIMD=OFF -DWITH_TURBOJPEG=OFF -DWITH_TOOLS=OFF -DWITH_TESTS=OFF
          cmake_djgpp "$SOURCES/libpng" \
            -DZLIB_ROOT="$PREFIX" \
            -DZLIB_LIBRARY="$PREFIX/lib/libz.a" \
            -DZLIB_INCLUDE_DIR="$PREFIX/include" \
            -DPNG_SHARED=OFF -DPNG_STATIC=ON \
            -DPNG_TESTS=OFF -DPNG_TOOLS=OFF
          cp "$PREFIX/lib/libpng.a" "$PREFIX/lib/libpng18.a"
          cmake_djgpp "$SOURCES/freetype" \
            -DZLIB_ROOT="$PREFIX" -DBZip2_ROOT="$PREFIX" \
            -DZLIB_LIBRARY="$PREFIX/lib/libz.a" \
            -DZLIB_INCLUDE_DIR="$PREFIX/include" \
            -DBZIP2_LIBRARY_RELEASE="$PREFIX/lib/libbz2.a" \
            -DBZIP2_INCLUDE_DIR="$PREFIX/include" \
            -DPNG_LIBRARY="$PREFIX/lib/libpng.a" \
            -DPNG_PNG_INCLUDE_DIR="$PREFIX/include" \
            -DFT_REQUIRE_ZLIB=ON -DFT_REQUIRE_BZIP2=ON -DFT_REQUIRE_PNG=ON \
            -DFT_DISABLE_HARFBUZZ=ON -DFT_DISABLE_BROTLI=ON -DFT_DISABLE_HVF=ON \
            -DBUILD_SHARED_LIBS=OFF
          cmake_djgpp "$SOURCES/ogg" \
            -DBUILD_SHARED_LIBS=OFF -DINSTALL_DOCS=OFF
          cmake_djgpp "$SOURCES/vorbis" \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF \
            -DOGG_ROOT="$PREFIX" \
            -DOGG_LIBRARY="$PREFIX/lib/libogg.a" \
            -DOGG_INCLUDE_DIR="$PREFIX/include"
          cmake_djgpp "$SOURCES/SDL" \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_EXAMPLES=OFF

      - name: Configure OpenCP
        run: |
          set -euo pipefail
          git -C playsid/libresidfp-git apply "$GITHUB_WORKSPACE/.github/patches/residfp-djgpp.patch"
          git -C playsndh/psgplay-git apply "$GITHUB_WORKSPACE/.github/patches/psgplay-djgpp.patch"
          autoconf
          export PATH="/usr/local/djgpp/bin:$PATH"
          export PKG_CONFIG_LIBDIR="$RUNNER_TEMP/djgpp-deps/lib/pkgconfig"
          export CPPFLAGS="-I$RUNNER_TEMP/djgpp-deps/include -I$RUNNER_TEMP/djgpp-deps/include/freetype2 -I$RUNNER_TEMP/djgpp-deps/include/libpng18"
          export LDFLAGS="-L$RUNNER_TEMP/djgpp-deps/lib"
          ./configure \
            --build="$(gcc -dumpmachine)" \
            --host=i586-pc-msdosdjgpp \
            --with-sdl3 --with-builtin=core
          make -j2

      - name: Run DOSEMU startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          for module in \
            playogg/playogg.rel playqoa/playqoa.rel playsndh/playsndh.rel \
            playtimidity/playtimidity.rel; do
            test -s "$module"
          done
          wget -q https://www.delorie.com/pub/djgpp/current/v2misc/csdpmi7b.zip
          unzip -j -o csdpmi7b.zip "bin/CWSDPMI.EXE" -d .
          set +e
          timeout 30s dosemu -dumb ocp.exe > dosemu.log 2>&1
          status=$?
          set -e
          cat dosemu.log
          grep -Fq "initializing fileselector" dosemu.log
          grep -Fq "[SDL] Using audio driver soundblaster" dosemu.log
          grep -Fq "devpSDL3: SDL 3.x Player" dosemu.log
          if grep -Eq "Exiting due to signal SIG[A-Z]+" dosemu.log; then
            echo "OpenCP crashed under DOSEMU:"
            exit 1
          elif [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            echo "DOSEMU exited unexpectedly with status $status"
            exit "$status"
          fi

      - name: Upload DOS build and smoke-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencubicplayer-dos-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ocp.exe
            ocp.ini
            dosemu.log
